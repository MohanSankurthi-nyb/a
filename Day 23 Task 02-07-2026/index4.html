<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
        }
        body{
             font-family: Arial,sans-serif;
        }
        header{
            background: steelblue;
            color: white;
            text-align: center;
            padding: 20px;
        }
        nav{
            display: flex;
            justify-content: center;
            gap: 20px;
            background: #333;
            padding: 15px;
        }
        nav a{
            color: white;
            text-decoration: none;
            padding:10px;
        }
        .hero{
            text-align: center;
            padding: 40px;
        }
        .hero img{
            width: 100%;
            max-width: 700px;
            height: auto;
            border-radius: 10px;
        }
        .container{
            display: grid;
            gap: 20px;
            padding:20px;
        }
        .card{
            background: #f4f4f4;
            padding: 30px;
            text-align: center;
            border: 2px solid gray;
            border-radius: 10px;
        }
        /* mobile phones */
        @media(max-width:767px){
            nav{
                flex-direction: column;
                align-items: center;
            }
            .container{
                grid-template-columns: 1fr;
            }
            body{
                font-size: 14px;
            }
            .hero{
                padding: 20px;
            }
            /* tablets */
            @media(min-width: 768px) and (max-width:1023px){
                .container{
                    grid-template-columns: repeat(2,1fr);
                }
                body{
                    font-size: 16px;
                }
            }
            /* laptops */
            @media(min-width: 1024px) and (max-width:1439px){
                .container{
                    grid-template-columns: repeat(3,1fr);
                }
                body{
                    font-size: 18px;
                }
            }
            /* desktop screens */
            @media(min-width: 1440px) {
                .container{
                    grid-template-columns: repeat(4,1fr);
                }
                body{
                    font-size: 20px;
                }
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Responsive webpage</h1>
    </header>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>
    <section class="hero">
        <h1>Welcome to Responsive Web Design</h1>
        <p>This page uses Flexbox,Grid,and Media Queries
        </p>
        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600" alt="Nature">
    </section>
    <div class="container">
        <div class="card">
            <h3>Card 1</h3>
            <p>Flexbox Navigation</p>
        </div>
        <div class="card">
            <h3>Card 2</h3>
            <p>Grid Layout</p>
        </div>
        <div class="card">
            <h3>Card 3</h3>
            <p>Media Queries</p>
        </div>
        <div class="card">
            <h3>Card 4</h3>
            <p>Responsive Images</p>
        </div>
    </div>
</body>
</html>
