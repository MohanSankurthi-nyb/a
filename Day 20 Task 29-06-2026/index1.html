<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Inline css
    Css is written directly inside the HTML elements using the style attribute -->
    <h1 style="color:blue">Welcome to inline CSS</h1>
    <p style="font-family: 18px;color:gray">
        This paragraph uses inline css
    </p>
</body>
</html>
