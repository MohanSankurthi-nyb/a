<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML with internal CSS</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background: color #f4f4f4;;
            text-align: center;
        }
        h1{
            color:white;
            background-color: #0077cc;
            padding:20px;
        }
        p{
            font-size: 18px;
            color:#333;
            margin:20px;
        }
        button{
            background-color: green;
            color:white;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover{
            background-color: darkgreen;
        }
    </style>
</head>
<body>
    <h1>Welcome to my page</h1>
    <p>This page uses internal css styling</p>
    <button>Click Me</button>
</body>
</html>
