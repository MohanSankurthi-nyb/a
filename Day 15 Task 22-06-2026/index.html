<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="grandparent">
        Grandparent 
        <div id="parent">
            Parent 
            <button id="child">Click Me </button>
        </div>
    </div>
<br>
    <div id="container">
        <button>Button 1</button>
        <button>Button 2</button>
    </div>
    <button id="addBtn">Add New Button</button>
     <br>
     <br>
    <button id="btn">Click ME</button>
    <br>
    <input type="text" id="name" placeholder="Type here">
    <br><br>
    <form id="myForm">
        <input type="text" placeholder="Enter Name"><br>
        <button type="submit">Submit</button>
    </form>
    <br><br>
    <select id="city">
        <option>Secunderabad</option>
        <option>Hyderabad</option>
        <option>Adilabad</option>
    </select>
    <br> <br>
    <button id="btn1">Click Fast</button><br> <br>
    <input type="text" id="search" placeholder="Search">
    <script>
        
        //event bubbling
        document.getElementById("grandparent").addEventListener("click",()=>{
            console.log("Grandparent clicked")
        })
        document.getElementById("parent").addEventListener("click",()=>{
            console.log("parent clicked")
        })
        document.getElementById("child").addEventListener("click",()=>{
            console.log("Button clicked")
        })

        // Click Event -> Triggered when a user clicks an element
        document.getElementById("btn").addEventListener("click",()=>{
            console.log("Button clicked")
        })
        //input event -> Triggered whenever the value of an input changes while typing
        document.getElementById("name").addEventListener("input",(e)=>{
            console.log(e.target.value)
        })
        //sumbit event -> Triggered when a form is submitted
        document.getElementById("myForm").addEventListener("submit",(e)=>{
            e.preventDefault()
            console.log("Form submitted")
        })
        //change event-> Triggered when the value changes and loses focus(or selection changes)
        document.getElementById("city").addEventListener("change",(event)=>{
            console.log("Selected:",event.target.value)
        })

        //throttling
        function throttle(func,delay){
            let canRun = true
            return function(){
                if(canRun){
                    func()
                    canRun=false
                    setTimeout(()=>{
                        canRun=true
                    },delay)
                }
            }
        }
        const throttledClick = throttle(()=>{
            console.log("Button Clicked")
        },2000)
        document.getElementById("btn1")
        .addEventListener("click",throttledClick)

        //Debouncing
        function debounce(func,delay){
            let timer;
            return function(){
                clearTimeout(timer);
                timer=setTimeout(()=>{
                    func();
                },delay);
            };
        }
        const debounceSearch = debounce(()=>{
            console.log("Searching...")
        },2000);
        document.getElementById("search")
        .addEventListener("input",debounceSearch);
    </script>
     <script src="./index.js"></script>
</body>
</html>
