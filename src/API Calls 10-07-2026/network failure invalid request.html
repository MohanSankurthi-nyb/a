<!DOCTYPE html>
<html>
<head>
    <title>Error Handling API Example</title>
</head>
<body>
<h2>User Posts</h2>
<button onclick="getPosts()">Load Posts</button>
<p id="message"></p>
<div id="output"></div>
<script>
async function getPosts() {
    const message = document.getElementById("message");
    const output = document.getElementById("output");

    // Clear previous data
    output.innerHTML = "";

    // Loading message
    message.innerHTML = "Loading data...";

    try {
        const response = await fetch(
            "https://jsonplaceholder.typicode.com/posts"
        );
        // Check invalid response
        if (!response.ok) {
            throw new Error(
                `Server Error: ${response.status}`
            );
        }
        const data = await response.json();
        // Check if data is empty or invalid
        if (!data || data.length === 0) {
            throw new Error("No data found");
        }

        // Success message
        message.innerHTML = "Data loaded successfully";

        // Display data
        data.slice(0, 5).forEach(post => {

            output.innerHTML += `
                <h3>${post.title}</h3>
                <p>${post.body}</p>
                <hr>
            `;

        });
    } catch(error) {
        // Display error message to user
        message.innerHTML =
            "❌ Error: " + error.message;
        console.error(error);
    }
}

</script>
</body>
</html>
