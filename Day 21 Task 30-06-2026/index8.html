<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            margin:0
        }
        .navbar{
            position:fixed;
            width:100%;
            background-color: blue;
            color:white;
            padding:15px;
            text-align: center;
        }
        .sticky-header{
            position: sticky;
            top:60px;
            background-color: orange;
            padding:10px;
            border:2px solid black;
        }
        .static-box{
            position:static;
            background-color: lightblue;
            padding: 20px;
            margin:20px;
            border:2px solid black;
        }
        .relative-box{
            position: relative;
            left:50px;
            top:20px;
            background-color: lightgreen;
            padding: 20px;
            margin:20px;
            border:2px solid black;
            }
            .parent{
                position: relative;
                width: 400px;
                height:200px;
                border:3px solid red;
                margin: 50px auto;
            }
            .absolute-box{
                position: absolute;
                top:20px;
                right:20px;
                background-color: yellow;
                padding:15px
            }
            .content{
                height:1000px;
            }
        
    </style>
</head>
<body>
    <div class="navbar">
        fixed navbar   
    </div>
    <br><br><br>
    <div class="sticky-header">
        sticky header
    </div>
    <div class="static-box">
        static position example
    </div>
    <div class="relative-box">
        relative position example
    </div>
    <div class="parent">
        parent flex-container 
        <div class="absolute-box">
            absolute position example
        </div>
    </div>
    <div class="content">
        scroll down to observe the fixed navbar and sticky header
    </div>
</body>
</html>
