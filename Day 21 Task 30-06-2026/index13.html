<!DOCTYPE html>
<html>
<head>
    <title>Responsive Flexbox + Grid</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Header using Flexbox */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2196F3;
            color: white;
            padding: 15px;
        }

        nav {
            display: flex;
            gap: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        /* Main layout using CSS Grid */
        .container {
            display: grid;
            grid-template-columns: 1fr 3fr;
            gap: 15px;
            padding: 20px;
        }

        aside {
            background: #f4f4f4;
            padding: 20px;
        }

        main {
            background: #e8f5e9;
            padding: 20px;
        }

        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 15px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                text-align: center;
            }

            nav {
                flex-direction: column;
                margin-top: 10px;
            }

            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<header>
    <h2>My Website</h2>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>
</header>

<div class="container">
    <aside>
        <h3>Sidebar</h3>
        <p>Links and menu items.</p>
    </aside>

    <main>
        <h3>Main Content</h3>
        <p>This section contains the main content of the webpage.</p>
    </main>
</div>

<footer>
    © 2026 My Website
</footer>

</body>
</html>
