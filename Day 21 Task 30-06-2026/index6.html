<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .borderBox{
            border:5px solid red;
            padding:20px;
        }
        .outlineBox{
            outline: 5px solid blue;
            padding: 20px;
        }
    </style>
</head>
<body>
    <!-- outline vs border -->
     <div class="borderBox">Border Example</div>
     <div class="outlineBox">Outline Example</div>
</body>
</html>

<!-- Border                          Outline
takes space in box model        does not take place
affects element size            does not affect size
can have individual sides       cannot have individual sides -->
