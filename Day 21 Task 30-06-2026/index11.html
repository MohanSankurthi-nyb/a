<!DOCTYPE html>
<html>
<head>
    <title>CSS Grid Layout</title>
    <style>
        .container {
            display: grid;
            grid-template-areas:
                "header header"
                "sidebar content"
                "footer footer";
            grid-template-columns: 1fr 3fr;
            gap: 10px;
            height: 100vh;
        }

        .header {
            grid-area: header;
            background: lightblue;
            padding: 20px;
            text-align: center;
        }

        .sidebar {
            grid-area: sidebar;
            background: lightgreen;
            padding: 20px;
        }

        .content {
            grid-area: content;
            background: lightyellow;
            padding: 20px;
        }

        .footer {
            grid-area: footer;
            background: lightgray;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">Header</div>
    <div class="sidebar">Sidebar</div>
    <div class="content">Main Content</div>
    <div class="footer">Footer</div>
</div>

</body>
</html>
