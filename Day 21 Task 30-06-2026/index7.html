<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Block */
        .block{
            display: block;
            background-color: lightblue;
            border: 2px solid blue;
            padding: 10px;
            margin: 10px 0;
        }
        /* inline */
        .inline{
            display: inline;
            background-color: lightgreen;
            border: 2px solid green;
            padding: 5px;
        }
        /* inline-block */
        .inine-block{
            display: inline-block;
            width: 120px;
            height: 60px;
            background-color: orange;
            border: 2px solid black;
            text-align: center;
            line-height: 60px;
            margin: 10px;
        }
        /* None */
        .hidden{
            display: none;
        }
        /* Flex */
        .flex-container{
            display: flex;
            gap: 10px;
            border: 2px solid red;
            padding: 10px;
            margin-top: 20px;
        }
        .flex-item{
            width:100px;
            height:80px;
            background-color: pink;
            text-align:center;
            line-height: 80px;
        }
        .grid-container{
            display:grid;
            grid-template-columns: repeat(3,1fr);
            gap:10px;
            border:2px solid purple;
            padding:10px;
            margin-top:20px;
        }
        .grid-item{
            background-color: lightyellow;
            border: 2px solid black;
            padding:20px;
            margin-top:20px
        }
    </style>
</head>
<body>
    <h2>1.block elements</h2>
    <div class="block">block element 1</div>
    <div class="block">block element 2</div>

    <h2>2.inline element</h2>
    <span class="inline">HTML</span>
    <span class="inline">CSS</span>
    <span class="inline">Java</span>

    <h2>3.inline-block element</h2>
    <div class="inine-block"> box 1</div>
    <div class="inine-block"> box 2</div>
    <div class="inine-block"> box 3</div>

    <h2>4.Display None</h2>
    <p> This paragraph is visible</p>
    <p class="hidden">You cant see this paragraph</p>
    <p>This paragraph also visible</p>

    <h2>5.Flex layout</h2>
    <div class="flex-container">
        <div class="flex-item">1</div>
        <div class="flex-item">2</div>
        <div class="flex-item">3</div>
    </div>

    <h2>6.Grid layout</h2>
    <div class="grid-container">1</div>
    <div class="grid-container">2</div>
    <div class="grid-container">3</div>
    <div class="grid-container">4</div>
    <div class="grid-container">5</div>
</body>
</html>
