<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS box model</title>
    <style>
    .box{
        width:200px;
        height: 100px;
        padding:20px;
        border: 5px solid blue;
        margin: 30px;
        background-color: lightyellow;
    }
    </style>
</head>
<body>
    <div class="box">
        Content Area
    </div>
</body>
</html>

<!-- content -> content area 
padding -> 20px
border -> 5px solid blue
margin -> 30px -->
