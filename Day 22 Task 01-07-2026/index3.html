<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid and Flexbox</title>
    <style>
         *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            display: grid;
            grid-template-columns: 1fr 3fr;
            grid-template-areas: 
            "header header"
            "nav nav"
            "sidebar content"
            "footer footer";
            gap:10px;
            min-height: 100vh;
            padding:10px;
        }
        .header{
            grid-column: header;
            background: lightblue;
            padding:20px;
            text-align: center;
        }
        .navbar{
            grid-area: nav;
            display: flex;
            justify-content: center;
            gap:20px;
            background: lightgreen;
            padding: 15px;
        }
        .navbar a{
            text-decoration:none;
            color: black;
        }
        .sidebar{
            grid-area: sidebar;
            background: lightgray;
            padding:20px;
        }
        .content{
            grid-area: content;
            background: #f4f4f4;
            padding: 20px;
        }
        .cards{
            display: flex;
            gap:20px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .card{
            flex: 1;
            min-width: 150px;
            background: orange;
            padding: 40px;
            text-align: center;
        }
        .footer{
            grid-area: footer;
            background: lightblue;
            padding:20px;
            text-align: center;
        }
        @media(max-width:768px){
            .container{
                grid-template-columns: 1fr;
                grid-template-areas: 
                "header"
                "nav"
                "sidebar"
                "content"
                "footer";
            }
            .navbar{
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            Website Header
        </header>
        <nav class="navbar">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
        </nav>
        <aside class="sidebar">
            <h2>Sidebar</h2>
        </aside>
        <main class="content">
            <h2>Main Content</h2>
            <div class="cards">
                <div class="card">Card 1</div>
                <div class="card">Card 2</div>
                <div class="card">Card 3</div>
            </div>
        </main>
    </div>
    <footer class="footer">
        Footer
    </footer>
    </div>
</body>
</html>
