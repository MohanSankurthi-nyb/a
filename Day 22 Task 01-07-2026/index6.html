<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Dashboard</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
        }
        .dashboard{
            display:grid;
            grid-template-areas: 
            "header header header"
            "sidebar main widget"
            "sidebar main widget"
            "footer footer footer";
            grid-template-columns: 220px 1fr 250px;
            grid-template-rows: 80px 1fr 1fr 60px;
            gap:10px;
            min-height: 100vh;
            padding: 10px;
            background: #f4f4f4;
        }
        .header{
            grid-area: header;
            background-color: #4CAF50;
            color:white;
            display: grid;
            place-items: center;
        }
        .sidebar{
            grid-area: sidebar;
            background-color: #2196F3;
            color:white;
            display: grid;
            place-items: center;
        }
        .main{
            grid-area: main;
            background-color: #FFC107;
            display: grid;
            place-items: center;
        }
        .widget{
            grid-area:widget;
            background: #9C2780 ;
            color:white;
            display: grid;
            place-items: center;
        }
        .footer{
            grid-area: footer;
            background: #333;
            color: white;
            display: grid;
            place-items: center;
        }
        @media(max-width:768px){
            .dashboard{
                grid-template-areas: 
                "header"
                "sidebar"
                "main"
                "widget"
                "footer";
                grid-template-columns: 1fr;
                grid-auto-flow: auto;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">Header</div>
        <div class="sidebar">Sidebar</div>
        <div class="main">Main Content</div>
        <div class="widget">Widgets</div>
        <div class="footer">Footer</div>
    </div>
</body>
</html>
